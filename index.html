<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1e3352">
<title>キンダイシフト</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#eef1f5}
iframe{display:block;border:0;width:100%;height:100%}
#off{display:none;font:16px/1.7 sans-serif;padding:24px;color:#1e3352}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxpAZowTfkro2b43Hhwmbf7sJPTsdNZZtak0_8e00MeClUjxe-TrboAqfQqOq6Y-IXuzg/exec" title="キンダイシフト" allow="clipboard-write"></iframe>
<div id="off">インターネットにつながっていません。<br>つながってから、もう一度開いてください。</div>
<script>
if(!navigator.onLine){document.getElementById('app').style.display='none';document.getElementById('off').style.display='block';}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
